<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareVoice - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#1e3a8a 0%, #3b82f6 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:white;width:100%;max-width:900px;border-radius:24px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.25)}
.left{background:#f8fafc;padding:30px;display:flex;flex-direction:column;justify-content:center}
.left img{width:100%;height:140px;object-fit:cover;border-radius:16px;margin-bottom:14px}
.right{padding:36px}
.logo{font-size:26px;font-weight:800;color:#1d4ed8;letter-spacing:-0.5px}
.input{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:12px;margin-top:10px;font-size:14px;outline:none}
.input:focus{border-color:#2563eb}
.btn{width:100%;padding:13px;background:#2563eb;color:white;border:none;border-radius:12px;font-weight:700;margin-top:18px;cursor:pointer;font-size:15px}
.btn:hover{background:#1d4ed8}
@media(max-width:700px){.box{grid-template-columns:1fr}.left{display:none}}
</style>
</head>
<body>
<div class="box">
  <div class="left">
    <h2 style="color:#1e40af;font-weight:800;margin-bottom:12px">🏥 CareVoice AI<br><span style="font-size:13px;color:#64748b;font-weight:600">AI Powered Hospital System</span></h2>
    <img src="/images/hospital.jpg" onerror="this.src='https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=600'">
    <img src="/images/scan.jpg" onerror="this.src='https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=600'">
    <p style="font-size:11px;color:#64748b;margin-top:12px;line-height:16px">✅ AI Voice Triage<br>✅ 5 Doctors: Usha Rani, Amulya, Hasini, Kumar, Lakshmi<br>✅ Real-time Consultation</p>
  </div>
  <div class="right">
    <div class="logo">CareVoice AI</div>
    <p style="color:#64748b;font-size:13px;margin-top:6px;font-weight:600">Welcome back! Please login</p>
    <input id="email" class="input" placeholder="Email - ex: pramodkaiser325@gmail.com" value="pramodkaiser325@gmail.com">
    <input id="pass" type="password" class="input" placeholder="Password" value="123456">
    <select id="role" class="input">
      <option value="PATIENT">PATIENT</option>
      <option value="DOCTOR">DOCTOR</option>
      <option value="ADMIN">ADMIN</option>
    </select>
    <button class="btn" onclick="login()">Login →</button>
    <p style="font-size:11px;color:#94a3b8;text-align:center;margin-top:14px">Demo: any email/pass works</p>
  </div>
</div>
<script>
function login(){
  localStorage.setItem('email',document.getElementById('email').value);
  localStorage.setItem('role',document.getElementById('role').value);
  location.href='dashboard.html';
}
</script>
</body>
</html>
